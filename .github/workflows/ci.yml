name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: 全量静态检查（archcheck + 日志敏感信息扫描 + go vet）
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: 后端测试（含 pkg 公共库）
        run: |
          cd apps/server && go test ./... && go test ./pkg/...
      - name: archcheck 自检
        run: cd tools/archcheck && go test ./...
      - name: logscan 自检
        run: cd tools/logscan && go test ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 契约生成与漂移检查（生成物必须与仓库一致）
        run: |
          make gen
          git diff --exit-code -- apps/server/internal/gen packages/api-client packages/domain-types
      - name: 生成物可编译
        run: cd apps/server && go build ./...
      - name: 前端类型检查
        run: pnpm -r exec tsc -p tsconfig.json --noEmit

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: archcheck（独立门禁，便于按检查名单独要求）
        run: cd tools/archcheck && go run . -root ../../apps/server

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: 依赖漏洞扫描（govulncheck）
        working-directory: apps/server
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: 密钥/敏感信息扫描（gitleaks）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
