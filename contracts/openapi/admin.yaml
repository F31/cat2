        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    get:
      tags: [admin-identity]
      summary: 用户列表（按状态/关键字）
      operationId: adminListUsers
      parameters:
        - name: status
          in: query
          schema: { type: integer, description: '-1 全部；0 正常 / 1 封禁等' }
        - name: q
          in: query
          schema: { type: string, description: 昵称/手机号（脱敏）模糊 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin-identity]
      summary: 新增用户（后台代建；手机号唯一）
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, phone, identity_type]
              properties:
                nickname: { type: string, maxLength: 32 }
                phone: { type: string }
                identity_type: { type: integer, enum: [1, 2] }
                real_name: { type: string, maxLength: 64 }
                id_card_no: { type: string, maxLength: 18 }
                region_code: { type: string, maxLength: 12 }
      responses:
        '200': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/{id}:
    put:
      tags: [admin-identity]
      summary: 编辑用户资料（昵称/手机号/主体类型；手机号留空不改）
      operationId: adminUpdateUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, identity_type]
              properties:
                nickname: { type: string, maxLength: 32 }
                phone: { type: string }
                identity_type: { type: integer, enum: [1, 2] }
                real_name: { type: string, maxLength: 64 }
                id_card_no: { type: string, maxLength: 18 }
                region_code: { type: string, maxLength: 12 }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [admin-identity]
      summary: 软删除/注销用户（保留历史数据，禁止登录）
      operationId: adminDeleteUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /users/{id}/card:
    get:
      tags: [admin-governance]
      summary: 后台读取用户/组织名片（不做对外展示过滤）
      operationId: adminGetUserCard
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 名片, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    put:
      tags: [admin-governance]
      summary: 后台维护组织名片（跳过认证锁定；保留联系方式和资质材料）
      operationId: adminUpdateOrgCard
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOrgCardInput' }
      responses:
        '200': { description: 已保存, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /users/{id}/ban:
    post:
      tags: [admin-identity]
      summary: 封禁账号（递增 authz_ver，旧令牌立即失效；记录原因审计）
      operationId: adminBanUser
      parameters:
        - $ref: '#/components/parameters/PathUserID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 封禁结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StatusData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/{id}/unban:
    post:
      tags: [admin-identity]
      summary: 解封账号
      operationId: adminUnbanUser
      parameters:
        - $ref: '#/components/parameters/PathUserID'
      responses:
        '200':
          description: 解封结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StatusData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /contents:
    get:
      tags: [admin-content]
      summary: 内容列表（按类型/状态）
      operationId: adminListContents
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [project, product, meeting, event] }
        - name: status
          in: query
          schema: { type: integer, description: '-1 全部；0 审核中 / 1 展示中 / 2 已下架' }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: 内容列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ContentItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /contents/{id}/takedown:
    post:
      tags: [admin-content]
      summary: 下架内容（记录原因）
      operationId: adminTakedownContent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 下架后的内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContentItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /products:
    post:
      tags: [admin-content]
      summary: 产品库三步入库（代企业创建产品，进入审核中）
      operationId: adminCreateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_id, title]
              properties:
                owner_id: { type: string, description: 企业主体用户 ID }
                title: { type: string, maxLength: 50 }
                region_code: { type: string }
                industry_codes: { type: array, items: { type: string } }
                need_codes: { type: array, items: { type: string } }
                offer_codes: { type: array, items: { type: string } }
                fields:
                  type: object
                  additionalProperties: true
                  description: 产品字段（carousel_file_ids/core_strength/key_points/intro 等）
      responses:
        '200':
          description: 创建的产品（审核中）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContentItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /contents/{id}:
    get:
      tags: [admin-content]
      summary: 后台内容完整详情
      operationId: adminGetContent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 内容详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContentItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /contents/{id}/review:
    post:
      tags: [admin-content]
      summary: 内容/产品入库人工审核
      operationId: adminReviewContent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                reason: { type: string }
      responses:
        '200':
          description: 审核后的内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContentItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /review-tasks:
    get:
      tags: [admin-trust]
      summary: 审核队列（按 SLA 到期升序）
      operationId: adminReviewQueue
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: 待审队列
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ReviewTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /review-tasks/{id}/resolve:
    post:
      tags: [admin-trust]
      summary: 复核结论（通过/驳回，驳回须填原因）
      operationId: adminResolveReview
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean }
                reason: { type: string, description: 驳回原因（驳回时必填） }
      responses:
        '200':
          description: 复核结论（含违规记分与限制）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Verdict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /review-metrics:
    get:
      tags: [admin-trust]
      summary: 审核 SLA 指标（待审/超时/平均复核时长）
      operationId: adminReviewMetrics
      responses:
        '200':
          description: SLA 指标
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SLAMetric' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /orders:
    get:
      tags: [admin-trade]
      summary: 订单列表（按状态）
      operationId: adminListOrders
      parameters:
        - name: status
          in: query
          schema: { type: integer, description: '-1 全部；0 待支付 / 1 已支付 / 2 已关闭' }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /refunds:
    post:
      tags: [admin-trade]
      summary: 发起退款
      operationId: adminRefund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, amount_fen]
              properties:
                order_id: { type: string }
                amount_fen: { type: integer }
                reason: { type: string }
      responses:
        '200':
          description: 退款记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /fulfillments/{orderID}/retry:
    post:
      tags: [admin-trade]
      summary: 履约补偿重试（死信重置）
      operationId: adminRetryFulfillment
      parameters:
        - name: orderID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 是否重置成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reset: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /members:
    get:
      tags: [admin-membership]
      summary: 会员列表（按等级/状态）
      operationId: adminListMembers
      parameters:
        - name: level
          in: query
          schema: { type: integer, description: '-1 全部；1 VIP / 3 企业版' }
        - name: status
          in: query
          schema: { type: integer, description: '-1 全部；1 生效中 / 2 已过期' }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: 会员列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AdminMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /certs/{id}/realname:
    get:
      tags: [admin-verify]
      summary: 实名审核详情（姓名/证件号/正反面材料；需认证审核权限，查看写审计）
      operationId: adminRealnameDetail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 实名详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RealnameDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /certs/{id}/review:
    post:
      tags: [admin-governance]
      summary: 平台审核认证（全类型）
      operationId: adminReviewCert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pass], properties: { pass: { type: boolean }, reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /certs/pending:
    get:
      tags: [admin-governance]
      summary: 待审认证列表（reviewer_type：1 平台/2 企业）
      operationId: adminPendingCerts
      parameters:
        - { name: reviewer_type, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /affiliations/{id}/resolve:
    post:
      tags: [admin-governance]
      summary: 平台代处理归属核验（组织管理员超 7 天未处理）
      operationId: adminResolveAffiliation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pass], properties: { pass: { type: boolean }, reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /orgs/{id}/admins/reset:
    post:
      tags: [admin-governance]
      summary: 平台重置组织管理员（失联代处理/指派）
      operationId: adminResetOrgAdmin
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_id], properties: { user_id: { type: string }, remove: { type: boolean } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access Token（RS256 JWT，仅含 sub/sid/authz_ver，2h 有效）
  parameters:
    PathUserID:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未认证/令牌失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data: { nullable: true }
        request_id: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
    StatusData:
      type: object
      properties:
        status: { type: integer }
    AuditEntry:
      type: object
      required: [id, action, result]
      properties:
        id: { type: integer }
        actor_id: { type: integer }
        actor_type: { type: integer }
        channel: { type: string }
        action: { type: string }
        target_ref: { type: string }
        detail: { type: object, additionalProperties: true }
        result: { type: integer }
        ip: { type: string }
        request_id: { type: string }
        hash: { type: string }
        prev_hash: { type: string }
        created_at: { type: integer }
        archived: { type: boolean }
    ReviewSuggestion:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        category: { type: string }
        risk: { type: integer }
        summary: { type: string }
    SettingItem:
      type: object
      required: [key, type, value]
      properties:
        key: { type: string }
        type: { type: string }
        value: { type: string }
        default: { type: string }
        description: { type: string }
        sensitive: { type: boolean }
    FeatureFlag:
      type: object
      required: [key, enabled]
      properties:
        key: { type: string }
        enabled: { type: boolean }
        ratio: { type: integer }
        users: { type: array, items: { type: integer } }
    AdminSection:
      type: object
      required: [key, label, path, module]
      properties:
        key: { type: string }
        label: { type: string }
        path: { type: string }
        module: { type: string }
    DeadLetter:
      type: object
      required: [event_id, topic, occurred_at]
      properties:
        event_id: { type: string }
        topic: { type: string }
        space_id: { type: integer }
        occurred_at: { type: string, format: date-time }
    AdminUser:
      type: object
      properties:
        id: { type: string }
        nickname: { type: string }
        status: { type: integer, description: '0 正常 / 1 封禁等' }
        identity_type: { type: integer, description: '1 个人 / 2 组织' }
        realname_status: { type: integer }
        phone_masked: { type: string }
        created_at: { type: string, format: date-time }
    AdminGovernanceUser:
      type: object
      properties:
        id: { type: string }
        nickname: { type: string }
        status: { type: integer, description: '0 正常 / 1 限制 / 2 停用 / 3 注销' }
        identity_type: { type: integer, description: '1 个人 / 2 组织' }
        realname_status: { type: integer, description: '0 未实名 / 1 已实名 / 2 核验失败' }
        real_name: { type: string, description: 姓名（已通过实名优先，否则为后台录入） }
        id_card_masked: { type: string, description: 身份证号脱敏（前 4 后 4） }
        phone_masked: { type: string }
        region_code: { type: string }
        industry_codes: { type: array, items: { type: string } }
        created_at: { type: integer, description: Unix 秒 }
        member_level: { type: integer }
        member_active: { type: boolean }
    RealnameDetail:
      type: object
      properties:
        cert_id: { type: string }
        user_id: { type: string }
        real_name: { type: string }
        id_card_no: { type: string, description: 仅认证审核权限可见 }
        material_file_ids: { type: array, items: { type: integer } }
        status: { type: integer }
        submitted_at: { type: string, format: date-time }
    AdminOrg:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        nickname: { type: string }
        status: { type: integer }
        realname_status: { type: integer }
        phone_masked: { type: string }
        real_name: { type: string }
        id_card_masked: { type: string }
        category: { type: string }
        category_label: { type: string }
        region_code: { type: string }
        industry_codes: { type: array, items: { type: string } }
        cert_status: { type: integer }
