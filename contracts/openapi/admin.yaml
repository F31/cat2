openapi: 3.0.3
info:
  title: 猫平方运营后台 API
  version: 0.1.0
  description: |
    运营后台（admin）对外契约首版。与小程序契约（mp.yaml）分离，`make gen` 由本文件
    生成 Go stub 与 TS 类型。RBAC 细化为 p4；当前仅要求已登录（Admin 标记预留）。

    ## 全局约定
    - 统一响应信封 `{ code, message, data, request_id }`；成功 `code=0`
    - 错误码 `MMNNNN`：MM 为模块前缀（见 contracts/errors/README.md）
    - 金额一律分（int64）；ID 在 JSON 中为字符串；时间 RFC3339（UTC）
servers:
  - url: /api/admin/v1
tags:
  - name: admin-identity
  - name: admin-content
  - name: admin-trust
  - name: admin-trade
  - name: admin-membership
security:
  - bearerAuth: []
paths:
  /menus:
    get:
      tags: [admin-governance]
      summary: 后台菜单声明（AdminSection 声明式；p4 扩菜单级/操作级权限点）
      operationId: adminMenus
      responses:
        '200':
          description: 菜单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AdminSection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/step-up/code:
    post:
      tags: [admin-security]
      summary: 发送后台短信二次验证码（登录失败触发；p4 §3.4）
      operationId: adminStepUpSendCode
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /auth/step-up:
    post:
      tags: [admin-security]
      summary: 校验后台短信二次验证码（成功清除失败计数）
      operationId: adminStepUpVerify
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /auth/password/change:
    post:
      tags: [admin-security]
      summary: 修改后台主管理员密码（校验旧密码，写入 DB 后热生效）
      operationId: adminPasswordChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/reset/code:
    post:
      tags: [admin-security]
      summary: 发送后台找回密码短信验证码
      operationId: adminPasswordResetCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /auth/password/reset:
    post:
      tags: [admin-security]
      summary: 通过短信验证码重置后台密码
      operationId: adminPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, new_password]
              properties:
                phone: { type: string }
                code: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /jobs:
    get:
      tags: [admin-governance]
      summary: 可手动重跑的任务列表
      operationId: adminJobs
      responses:
        '200': { description: 任务名列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /jobs/{name}/run:
    post:
      tags: [admin-governance]
      summary: 手动重跑任务一次（审计）
      operationId: adminRunJob
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /memberships/{id}/transfer-master:
    post:
      tags: [admin-governance]
      summary: 转移企业版主账号（代操作，前后值审计）
      operationId: adminTransferMaster
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [to_user_id, reason], properties: { to_user_id: { type: string }, reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /memberships/sub-accounts/remove:
    post:
      tags: [admin-governance]
      summary: 强制解除子账号（代操作，前后值审计）
      operationId: adminForceRemoveSub
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [master_id, sub_user_id, reason], properties: { master_id: { type: string }, sub_user_id: { type: string }, reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /memberships/{id}/adjust:
    post:
      tags: [admin-governance]
      summary: 会员人工调整（等级/到期；前后值审计；双人复核待 RBAC）
      operationId: adminAdjustMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { level: { type: integer }, expire_at: { type: string }, reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /affiliations/overdue:
    get:
      tags: [admin-governance]
      summary: 超期未核验归属（平台代处理队列）
      operationId: adminOverdueAffiliations
      parameters:
        - { name: days, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /cubes:
    get:
      tags: [admin-cube]
      summary: 猫立方列表（后台）
      operationId: adminCubes
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /cubes/{id}:
    get:
      tags: [admin-cube]
      summary: 猫立方详情（基本信息/成员/项目）
      operationId: adminCubeDetail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 详情, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /cubes/{id}/projects:
    get:
      tags: [admin-cube]
      summary: 立方项目列表（研究/承接）
      operationId: adminCubeProjects
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /cubes/{id}/members/{uid}/remove:
    post:
      tags: [admin-cube]
      summary: 平台移除立方成员
      operationId: adminCubeRemoveMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: uid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '200': { description: 已移除, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /cubes/{id}/leader:
    post:
      tags: [admin-cube]
      summary: 平台调整猫王
      operationId: adminCubeSetLeader
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_id], properties: { user_id: { type: string } } }
      responses:
        '200': { description: 已调整, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /cubes/{id}/honey:
    post:
      tags: [admin-cube]
      summary: 平台调整猫蜜
      operationId: adminCubeSetHoney
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_id], properties: { user_id: { type: string } } }
      responses:
        '200': { description: 已调整, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /cubes/{id}/chats:
    get:
      tags: [admin-cube]
      summary: 立方/项目群聊记录（合规只读）
      operationId: adminCubeChats
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 群聊记录, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /cubes/{id}/ban:
    post:
      tags: [admin-governance]
      summary: 平台封禁猫立方（代操作，前后值审计）
      operationId: adminBanCube
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /cubes/{id}/dissolve:
    post:
      tags: [admin-governance]
      summary: 平台解散猫立方（代操作，前后值审计）
      operationId: adminDissolveCube
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /profile-templates:
    get:
      tags: [admin-profile]
      summary: 画像字段模板（主体类型 × 字段 + 字段池）
      operationId: adminProfileTemplates
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /circles:
    get:
      tags: [admin-circle]
      summary: 圈子列表（后台）
      operationId: adminCircles
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /circles/batch:
    post:
      tags: [admin-circle]
      summary: 圈子批量封禁/归档/解封/恢复（action=ban|archive|unban|restore；≤100，逐圈审计）
      operationId: adminBatchCircles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids, reason]
              properties:
                action: { type: string, enum: [ban, archive, unban, restore] }
                ids: { type: array, items: { type: string }, maxItems: 100 }
                reason: { type: string }
      responses:
        '200': { description: 结果（逐圈成功/失败）, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /circles/stats:
    get:
      tags: [admin-circle]
      summary: 圈子数据概览（新增/活跃/成员趋势）
      operationId: adminCircleStats
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses:
        '200': { description: 指标, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /circles/{id}:
    get:
      tags: [admin-circle]
      summary: 圈子详情（关于/成员/动态/需求/挂载）
      operationId: adminCircleDetail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 详情, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /circles/{id}/demands/{did}/remove:
    post:
      tags: [admin-circle]
      summary: 删除圈内需求（平台处置）
      operationId: adminCircleRemoveDemand
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: did, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /circles/{id}/feeds/{fid}/remove:
    post:
      tags: [admin-circle]
      summary: 删除圈内动态（平台处置）
      operationId: adminCircleRemoveFeed
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: fid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /circles/{id}/mounts/{mid}/remove:
    post:
      tags: [admin-circle]
      summary: 移除圈内挂载内容（平台处置）
      operationId: adminCircleRemoveMount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: mid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '200': { description: 已移除, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /circles/{id}/dissolve:
    post:
      tags: [admin-governance]
      summary: 平台解散圈子（代操作，前后值审计）
      operationId: adminDissolveCircle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /notices/broadcast:
    post:
      tags: [admin-governance]
      summary: 定向公告（管理员代操作，站内信；审计）
      operationId: adminBroadcastNotice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids, title, content]
              properties:
                user_ids: { type: array, items: { type: string } }
                title: { type: string }
                content: { type: string }
                reason: { type: string }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /ai/prompts:
    get:
      tags: [admin-ai]
      summary: AI 提示词版本列表（仅 approved 生效）
      operationId: adminAiPrompts
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    put:
      tags: [admin-ai]
      summary: 新增/更新提示词版本（approved 决定是否生效；审计）
      operationId: adminAiSavePrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature, version, body]
              properties:
                feature: { type: string }
                version: { type: string }
                body: { type: string }
                approved: { type: boolean }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /ai/usage:
    get:
      tags: [admin-ai]
      summary: AI 各能力用量/采纳率/成本（近 N 天）
      operationId: adminAiUsage
      parameters:
        - { name: days, in: query, schema: { type: integer } }
      responses:
        '200': { description: 统计, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /permissions:
    get:
      tags: [admin-rbac]
      summary: 权限点注册表（后台「角色与权限」页）
      operationId: adminPermissions
      responses:
        '200': { description: 权限点, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /roles:
    get:
      tags: [admin-rbac]
      summary: 角色列表（内置五角色默认矩阵，除超管外可配）
      operationId: adminRoles
      responses:
        '200': { description: 角色, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    post:
      tags: [admin-rbac]
      summary: 创建自定义角色（需 ops:rbac:manage；审计）
      operationId: adminCreateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties: { code: { type: string }, name: { type: string } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /roles/{code}:
    delete:
      tags: [admin-rbac]
      summary: 删除自定义角色（内置/超管不可删；在用不可删；审计）
      operationId: adminDeleteRole
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /roles/{code}/permissions:
    get:
      tags: [admin-rbac]
      summary: 角色权限
      operationId: adminRolePerms
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 权限, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    put:
      tags: [admin-rbac]
      summary: 设置角色权限（反提权；超管不可改；即时生效；审计）
      operationId: adminSetRolePerms
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [perms], properties: { perms: { type: array, items: { type: string } } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /roles/{code}/scope:
    put:
      tags: [admin-rbac]
      summary: 设置角色数据范围（多区域 + 含子区域；超管不可改；审计）
      operationId: adminSetRoleScope
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                region_codes: { type: array, items: { type: string } }
                include_subtree: { type: boolean }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /admin-users/{id}/roles:
    get:
      tags: [admin-rbac]
      summary: 后台账号角色
      operationId: adminUserRoles
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 角色, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    put:
      tags: [admin-rbac]
      summary: 分配后台账号角色（反提权/防锁死；审计）
      operationId: adminAssignRoles
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [roles], properties: { roles: { type: array, items: { type: string } } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /channel/operators:
    get:
      tags: [admin-channel]
      summary: 运营商列表（状态/区域过滤）
      operationId: adminChannelOperators
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /channel/operators/{id}/open:
    post:
      tags: [admin-channel]
      summary: 开通运营商（一地一家；审计）
      operationId: adminChannelOpenOperator
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /channel/operators/{id}/suspend:
    post:
      tags: [admin-channel]
      summary: 停用运营商（审计）
      operationId: adminChannelSuspendOperator
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /channel/operators/{id}/fees:
    get:
      tags: [admin-channel]
