            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reset: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /members:
    get:
      tags: [admin-membership]
      summary: 会员列表（按等级/状态）
      operationId: adminListMembers
      parameters:
        - name: level
          in: query
          schema: { type: integer, description: '-1 全部；1 VIP / 3 企业版' }
        - name: status
          in: query
          schema: { type: integer, description: '-1 全部；1 生效中 / 2 已过期' }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: 会员列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AdminMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /certs/{id}/review:
    post:
      tags: [admin-governance]
      summary: 平台审核认证（全类型）
      operationId: adminReviewCert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pass], properties: { pass: { type: boolean }, reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /certs/pending:
    get:
      tags: [admin-governance]
      summary: 待审认证列表（reviewer_type：1 平台/2 企业）
      operationId: adminPendingCerts
      parameters:
        - { name: reviewer_type, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /affiliations/{id}/resolve:
    post:
      tags: [admin-governance]
      summary: 平台代处理归属核验（组织管理员超 7 天未处理）
      operationId: adminResolveAffiliation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pass], properties: { pass: { type: boolean }, reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /orgs/{id}/admins/reset:
    post:
      tags: [admin-governance]
      summary: 平台重置组织管理员（失联代处理/指派）
      operationId: adminResetOrgAdmin
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_id], properties: { user_id: { type: string }, remove: { type: boolean } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access Token（RS256 JWT，仅含 sub/sid/authz_ver，2h 有效）
  parameters:
    PathUserID:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未认证/令牌失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data: { nullable: true }
        request_id: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
    StatusData:
      type: object
      properties:
        status: { type: integer }
    AuditEntry:
      type: object
      required: [id, action, result]
      properties:
        id: { type: integer }
        actor_id: { type: integer }
        actor_type: { type: integer }
        channel: { type: string }
        action: { type: string }
        target_ref: { type: string }
        detail: { type: object, additionalProperties: true }
        result: { type: integer }
        ip: { type: string }
        request_id: { type: string }
        hash: { type: string }
        prev_hash: { type: string }
        created_at: { type: integer }
        archived: { type: boolean }
    ReviewSuggestion:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        category: { type: string }
        risk: { type: integer }
        summary: { type: string }
    SettingItem:
      type: object
      required: [key, type, value]
      properties:
        key: { type: string }
        type: { type: string }
        value: { type: string }
        default: { type: string }
        description: { type: string }
        sensitive: { type: boolean }
    FeatureFlag:
      type: object
      required: [key, enabled]
      properties:
        key: { type: string }
        enabled: { type: boolean }
        ratio: { type: integer }
        users: { type: array, items: { type: integer } }
    AdminSection:
      type: object
      required: [key, label, path, module]
      properties:
        key: { type: string }
        label: { type: string }
        path: { type: string }
        module: { type: string }
    DeadLetter:
      type: object
      required: [event_id, topic, occurred_at]
      properties:
        event_id: { type: string }
        topic: { type: string }
        space_id: { type: integer }
        occurred_at: { type: string, format: date-time }
    AdminUser:
      type: object
      properties:
        id: { type: string }
        nickname: { type: string }
        status: { type: integer, description: '0 正常 / 1 封禁等' }
        identity_type: { type: integer, description: '1 个人 / 2 组织' }
        realname_status: { type: integer }
        phone_masked: { type: string }
        created_at: { type: string, format: date-time }
    TagSet:
      type: object
      properties:
        industry: { type: array, items: { type: string } }
        region: { type: string }
        nature: { type: array, items: { type: string } }
        need: { type: array, items: { type: string } }
        offer: { type: array, items: { type: string } }
        domain: { type: array, items: { type: string } }
    ContentItem:
      type: object
      required: [id, kind, title, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [project, product, meeting, event] }
        owner_ref:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
        title: { type: string }
        cover_file_id: { type: string }
        region_code: { type: string }
        tagset: { $ref: '#/components/schemas/TagSet' }
        status: { type: integer, description: '0 审核中 / 1 展示中 / 2 已下架' }
        reject_reason: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        fields: { type: object, additionalProperties: true }
        member_gate: { type: array, items: { type: string } }
        unlock_reason: { type: string }
    ReviewTask:
      type: object
      required: [id, source, subject_type, subject_id, risk_level, status]
      properties:
        id: { type: string }
        source: { type: integer, description: '1 机器命中 / 2 举报 / 3 认证材料 / 4 产品入库 / 5 高风险抽检' }
        subject_type: { type: string }
        subject_id: { type: string }
        risk_level: { type: integer }
        status: { type: integer, description: '0 待审 / 1 通过 / 2 驳回 / 3 已关闭' }
        reason: { type: string }
        sla_overdue: { type: boolean }
    Verdict:
      type: object
      required: [task_id, subject_type, subject_id, user_id, points, total, restricted]
      properties:
        task_id: { type: string }
        subject_type: { type: string }
        subject_id: { type: string }
        user_id: { type: string }
        points: { type: integer }
        total: { type: integer }
        restricted: { type: boolean }
    SLAMetric:
      type: object
      required: [pending, overdue, avg_review_seconds]
      properties:
        pending: { type: integer }
        overdue: { type: integer }
        avg_review_seconds: { type: integer }
    Order:
      type: object
      required: [id, biz_type, buyer_id, amount_fen, status]
      properties:
        id: { type: string }
        biz_type: { type: string }
        biz_ref: { type: string }
        buyer_id: { type: string }
        amount_fen: { type: integer }
        price_snapshot: { type: object, additionalProperties: true }
        status: { type: integer, description: '0 待支付 / 1 已支付 / 2 已关闭' }
        pay_expire_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
    Refund:
      type: object
      required: [id, payment_id, amount_fen, status, refund_no]
      properties:
        id: { type: string }
        payment_id: { type: string }
        amount_fen: { type: integer }
        status: { type: integer }
        refund_no: { type: string }
        created_at: { type: string, format: date-time }
    AdminMember:
      type: object
      properties:
        user_id: { type: string }
        level: { type: integer, description: '1 VIP / 3 企业版' }
        status: { type: integer, description: '1 生效中 / 2 已过期' }
        started_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_order_id: { type: string }
