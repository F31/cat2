openapi: 3.0.3
info:
  title: 猫平方运营后台 API
  version: 0.1.0
  description: |
    运营后台（admin）对外契约首版。与小程序契约（mp.yaml）分离，`make gen` 由本文件
    生成 Go stub 与 TS 类型。RBAC 细化为 p4；当前仅要求已登录（Admin 标记预留）。

    ## 全局约定
    - 统一响应信封 `{ code, message, data, request_id }`；成功 `code=0`
    - 错误码 `MMNNNN`：MM 为模块前缀（见 contracts/errors/README.md）
    - 金额一律分（int64）；ID 在 JSON 中为字符串；时间 RFC3339（UTC）
servers:
  - url: /api/admin/v1
tags:
  - name: admin-identity
  - name: admin-content
  - name: admin-trust
  - name: admin-trade
  - name: admin-membership
security:
  - bearerAuth: []
paths:
  /menus:
    get:
      tags: [admin-governance]
      summary: 后台菜单声明（AdminSection 声明式；p4 扩菜单级/操作级权限点）
      operationId: adminMenus
      responses:
        '200':
          description: 菜单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AdminSection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/step-up/code:
    post:
      tags: [admin-security]
      summary: 发送后台短信二次验证码（登录失败触发；p4 §3.4）
      operationId: adminStepUpSendCode
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /auth/step-up:
    post:
      tags: [admin-security]
      summary: 校验后台短信二次验证码（成功清除失败计数）
      operationId: adminStepUpVerify
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /jobs:
    get:
      tags: [admin-governance]
      summary: 可手动重跑的任务列表
      operationId: adminJobs
      responses:
        '200': { description: 任务名列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /jobs/{name}/run:
    post:
      tags: [admin-governance]
      summary: 手动重跑任务一次（审计）
      operationId: adminRunJob
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /memberships/{id}/transfer-master:
    post:
      tags: [admin-governance]
      summary: 转移企业版主账号（代操作，前后值审计）
      operationId: adminTransferMaster
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [to_user_id, reason], properties: { to_user_id: { type: string }, reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /memberships/sub-accounts/remove:
    post:
      tags: [admin-governance]
      summary: 强制解除子账号（代操作，前后值审计）
      operationId: adminForceRemoveSub
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [master_id, sub_user_id, reason], properties: { master_id: { type: string }, sub_user_id: { type: string }, reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /memberships/{id}/adjust:
    post:
      tags: [admin-governance]
      summary: 会员人工调整（等级/到期；前后值审计；双人复核待 RBAC）
      operationId: adminAdjustMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { level: { type: integer }, expire_at: { type: string }, reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /affiliations/overdue:
    get:
      tags: [admin-governance]
      summary: 超期未核验归属（平台代处理队列）
      operationId: adminOverdueAffiliations
      parameters:
        - { name: days, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /cubes/{id}/ban:
    post:
      tags: [admin-governance]
      summary: 平台封禁猫立方（代操作，前后值审计）
      operationId: adminBanCube
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /cubes/{id}/dissolve:
    post:
      tags: [admin-governance]
      summary: 平台解散猫立方（代操作，前后值审计）
      operationId: adminDissolveCube
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /circles/{id}/dissolve:
    post:
      tags: [admin-governance]
      summary: 平台解散圈子（代操作，前后值审计）
      operationId: adminDissolveCircle
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /notices/broadcast:
    post:
      tags: [admin-governance]
      summary: 定向公告（管理员代操作，站内信；审计）
      operationId: adminBroadcastNotice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids, title, content]
              properties:
                user_ids: { type: array, items: { type: string } }
                title: { type: string }
                content: { type: string }
                reason: { type: string }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /ai/prompts:
    get:
      tags: [admin-ai]
      summary: AI 提示词版本列表（仅 approved 生效）
      operationId: adminAiPrompts
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    put:
      tags: [admin-ai]
      summary: 新增/更新提示词版本（approved 决定是否生效；审计）
      operationId: adminAiSavePrompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature, version, body]
              properties:
                feature: { type: string }
                version: { type: string }
                body: { type: string }
                approved: { type: boolean }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /ai/usage:
    get:
      tags: [admin-ai]
      summary: AI 各能力用量/采纳率/成本（近 N 天）
      operationId: adminAiUsage
      parameters:
        - { name: days, in: query, schema: { type: integer } }
      responses:
        '200': { description: 统计, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /permissions:
    get:
      tags: [admin-rbac]
      summary: 权限点注册表（后台「角色与权限」页）
      operationId: adminPermissions
      responses:
        '200': { description: 权限点, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /roles:
    get:
      tags: [admin-rbac]
      summary: 角色列表（内置五角色默认矩阵，除超管外可配）
      operationId: adminRoles
      responses:
        '200': { description: 角色, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    post:
      tags: [admin-rbac]
      summary: 创建自定义角色（需 ops:rbac:manage；审计）
      operationId: adminCreateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties: { code: { type: string }, name: { type: string } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /roles/{code}:
    delete:
      tags: [admin-rbac]
      summary: 删除自定义角色（内置/超管不可删；在用不可删；审计）
      operationId: adminDeleteRole
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /roles/{code}/permissions:
    get:
      tags: [admin-rbac]
      summary: 角色权限
      operationId: adminRolePerms
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 权限, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    put:
      tags: [admin-rbac]
      summary: 设置角色权限（反提权；超管不可改；即时生效；审计）
      operationId: adminSetRolePerms
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [perms], properties: { perms: { type: array, items: { type: string } } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /roles/{code}/scope:
    put:
      tags: [admin-rbac]
      summary: 设置角色数据范围（多区域 + 含子区域；超管不可改；审计）
      operationId: adminSetRoleScope
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                region_codes: { type: array, items: { type: string } }
                include_subtree: { type: boolean }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /admin-users/{id}/roles:
    get:
      tags: [admin-rbac]
      summary: 后台账号角色
      operationId: adminUserRoles
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 角色, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    put:
      tags: [admin-rbac]
      summary: 分配后台账号角色（反提权/防锁死；审计）
      operationId: adminAssignRoles
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [roles], properties: { roles: { type: array, items: { type: string } } } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /exports:
    get:
      tags: [admin-governance]
      summary: 导出任务列表（管理员）
      operationId: adminExports
      parameters:
        - { name: all, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    post:
      tags: [admin-governance]
      summary: 申请导出（异步生成，带水印与导出审计）
      operationId: adminCreateExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template: { type: string, enum: [reconciliation, orders, users, reviews, settlements] }
                from: { type: integer }
                to: { type: integer }
      responses:
        '200': { description: 任务, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /exports/{id}/download:
    get:
      tags: [admin-governance]
      summary: 下载导出文件（带水印）
      operationId: adminDownloadExport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 下载地址, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /governance/users:
    get:
      tags: [admin-governance]
      summary: 用户检索筛选（昵称模糊/手机号盲精确/状态/实名/会员等级/注册时间）
      operationId: adminGovernanceUsers
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: phone, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: integer } }
        - { name: realname, in: query, schema: { type: integer } }
        - { name: identity_type, in: query, schema: { type: integer } }
        - { name: level, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{id}/restrict:
    post:
      tags: [admin-governance]
      summary: 限制发布/解除（days=0 解除；必须给原因；审计）
      operationId: adminRestrictUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days, reason]
              properties:
                days: { type: integer }
                reason: { type: string }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /users/{id}/360:
    get:
      tags: [admin-governance]
      summary: 用户 360（只读聚合：identity/profile/verify/membership/content/cube/circle/trust）
      operationId: adminUser360
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 聚合视图, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /badges:
    get:
      tags: [admin-governance]
      summary: 认证标识定义列表（后台可配，新增类型不改接口）
      operationId: adminBadgeDefs
      responses:
        '200': { description: 列表, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /badges/{code}:
    put:
      tags: [admin-governance]
      summary: 新增/更新认证标识定义
      operationId: adminUpsertBadge
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
                level: { type: integer }
                style: { type: object, additionalProperties: true }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /badges/grant:
    post:
      tags: [admin-governance]
      summary: 授予/撤销认证标识（代操作，审计）
      operationId: adminGrantBadge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_type, subject_id, code, grant]
              properties:
                subject_type: { type: string, enum: [user, org] }
                subject_id: { type: string }
                code: { type: string }
                grant: { type: boolean }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /dashboard/funnel:
    get:
      tags: [admin-governance]
      summary: 漏斗看板（注册→画像→匹配点击→联系发起→支付成功）
      operationId: adminDashboardFunnel
      parameters:
        - { name: days, in: query, schema: { type: integer } }
      responses:
        '200': { description: 漏斗, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /dashboard:
    get:
      tags: [admin-governance]
      summary: 数据概览（12+ 项核心指标，口径见 docs/ops/dashboards.md）
      operationId: adminDashboard
      responses:
        '200': { description: 指标, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /audits:
    get:
      tags: [admin-governance]
      summary: 审计查询（who/where/when/what/result 五维筛选）
      operationId: adminAudits
      parameters:
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: result, in: query, schema: { type: string } }
        - { name: target_ref, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          description: 审计列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
  /audits/{id}:
    get:
      tags: [admin-governance]
      summary: 审计详情（含哈希链字段与快照）
      operationId: adminAuditDetail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/AuditEntry' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /review-tasks/{id}/suggestion:
    get:
      tags: [admin-governance]
      summary: 审核任务的 AI 建议（只读；未启用或上游不可用时 available=false）
      operationId: adminReviewSuggestion
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 建议
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/ReviewSuggestion' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /settings:
    get:
      tags: [admin-governance]
      summary: 业务配置列表（含声明、当前值与默认值）
      operationId: adminSettings
      responses:
        '200':
          description: 配置列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/SettingItem' } }
  /settings/{key}:
    put:
      tags: [admin-governance]
      summary: 修改业务配置（热生效）
      operationId: adminSetSetting
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [value], properties: { value: { type: string } } }
      responses:
        '200':
          description: 结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: { data: { type: object, properties: { saved: { type: boolean } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /feature-flags:
    get:
      tags: [admin-governance]
      summary: 特性开关列表（灰度）
      operationId: adminFeatureFlags
      responses:
        '200':
          description: 开关列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/FeatureFlag' } }
  /feature-flags/{key}:
    put:
      tags: [admin-governance]
      summary: 配置特性开关（enabled/ratio/users）
      operationId: adminSetFeatureFlag
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
