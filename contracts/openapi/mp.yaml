openapi: 3.0.3
info:
  title: 猫平方小程序 API
  version: 0.1.0
  description: |
    小程序端（mp）对外契约首版。本文件是唯一事实来源：`make gen` 由本文件生成
    Go server stub（internal/gen/）与 TS 客户端（packages/api-client），不得手写绕过。

    ## 全局约定
    - 统一响应信封 `{ code, message, data, request_id }`；成功 `code=0`
    - 错误码 `MMNNNN`：MM 为模块前缀（见 contracts/errors/），NNNN 为模块内序号
    - 列表一律游标分页：`?cursor=&limit=`，响应 `data.items[]` + `data.next_cursor`（null 表示到底）
    - 写操作必须携带 `Idempotency-Key` 请求头（重复提交返回首次结果）
    - 所有响应带 `X-Request-Id`，与信封内 `request_id` 一致
    - 时间一律 RFC3339（UTC）；金额一律分（int64）；ID 在 JSON 中为字符串
servers:
  - url: /api/mp/v1
tags:
  - name: auth
  - name: profile
  - name: verify
  - name: content
  - name: trust
  - name: social
  - name: trade
  - name: dict
  - name: media
paths:
  /auth/wechat:
    post:
      tags: [auth]
      summary: 微信登录（注册/登录一体化）
      operationId: wechatLogin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: wx.login 返回的 code }
                phone_code: { type: string, description: 手机号快速验证 code（getPhoneNumber 事件返回） }
                encrypted_data: { type: string, description: 手机号加密数据（旧版 getPhoneNumber，兼容保留） }
                iv: { type: string }
                device: { type: string, description: 设备标识（会话审计） }
                identity_type:
                  type: integer
                  enum: [1, 2]
                  description: 注册身份（1个人/2组织），仅注册新用户时生效；登录老用户忽略，缺省 1
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /auth/phone/code:
    post:
      tags: [auth]
      summary: 发送短信验证码（备选登录通道）
      operationId: sendPhoneCode
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: 中国大陆手机号 }
      responses:
        '200':
          description: 已发送（无论号码是否已注册都返回成功，防枚举）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sent: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/phone:
    post:
      tags: [auth]
      summary: 手机号 + 短信验证码登录（备选通道，注册/登录一体化）
      operationId: phoneLogin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
                device: { type: string }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginData' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新访问令牌
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: 新令牌对
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me:
    get:
      tags: [auth]
      summary: 当前用户摘要
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 用户摘要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserBrief' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/deactivate:
    post:
      tags: [auth]
      summary: 账号注销（匿名化，其他模块订阅 UserDeactivated 各自清理）
      operationId: deactivateAccount
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/OkEmpty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cards/me:
    get:
      tags: [profile]
      summary: 我的名片（本人视图，不做展示过滤）
      operationId: getMyCard
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 我的名片
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Card' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [profile]
      summary: 更新我的名片（全量覆盖）
      operationId: updateMyCard
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardUpdate' }
      responses:
        '200':
          description: 更新后的名片
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cards/me/completion:
    get:
      tags: [profile]
      summary: 画像完成度（第二层五项任一为空即未完成；驱动「完善资料」提示条）
      operationId: getCardCompletion
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 完成度
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Completion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cards/me/share:
    post:
      tags: [profile]
      summary: 生成名片分享（小程序分享路径）
      operationId: shareMyCard
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 分享信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          share_path: { type: string }
                          title: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cards/{ref}:
    get:
      tags: [profile]
      summary: 他人名片（游客可访问；按对外展示设置过滤敏感字段）
      operationId: getCardByRef
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string, description: '实体引用 type:id，如 user:123 / org:456' }
      responses:
        '200':
          description: 名片（对外视图）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Card' }
        '404': { $ref: '#/components/responses/NotFound' }
  /certs:
    post:
      tags: [verify]
      summary: 提交认证（一期实名：真实姓名+身份证号+协议勾选，第三方二要素实时核验）
      operationId: submitCert
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertifyInput' }
      responses:
        '200':
          description: 认证结果（status=1 已通过 / 2 已驳回，驳回带 reject_reason 可重提）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Cert' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /certs/mine:
    get:
      tags: [verify]
      summary: 我的认证记录
      operationId: getMyCerts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 认证记录列表（新→旧）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Cert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /contents:
    post:
      tags: [content]
      summary: 创建内容（草稿=审核中；kind 区分四类，Fields 按 ContentKind schema 校验）
      operationId: publishContent
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentPublishInput' }
      responses:
        '200':
          description: 已创建（审核中）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContentItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /contents/mine:
    get:
      tags: [content]
      summary: 我的发布（可按 kind 过滤）
      operationId: listMyContents
      security: [{ bearerAuth: [] }]
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [project, product, meeting, event] }
      responses:
        '200':
          description: 我的内容列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ContentItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /contents/{id}/submit:
    post:
      tags: [content]
      summary: 提交审核（发布门槛：已实名；审核结论驱动状态机 #2）
      operationId: submitContent
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 提交结果（已展示/已下架）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContentItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /contents/{id}:
    get:
      tags: [content]
      summary: 内容详情（未展示内容非本人不可见；非会员过滤会员可见字段）
      operationId: getContent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 内容详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContentItem' }
        '404': { $ref: '#/components/responses/NotFound' }
  /contents/{id}/close:
    post:
      tags: [content]
      summary: 本人关闭内容（展示中→已下架）
      operationId: closeContent
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 已下架
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ContentItem' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /report-reasons:
    get:
      tags: [trust]
      summary: 举报原因枚举
      operationId: listReportReasons
      responses:
        '200':
          description: 举报原因列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ReportReason' }
  /reports:
    post:
      tags: [trust]
      summary: 举报（入人工复核队列，24h SLA）
      operationId: reportTarget
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportInput' }
      responses:
        '200':
          description: 已提交举报
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reported: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /follows:
    post:
      tags: [social]
      summary: 关注（幂等；目标为 EntityRef）
      operationId: followTarget
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TargetRefInput' }
      responses:
        '200':
          description: 关注状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { following: { type: boolean } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [social]
      summary: 我关注的
      operationId: listFollowing
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 关注列表（含 EntityResolver 回填标题）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/FollowItem' }
  /follows/{ref}:
    delete:
      tags: [social]
      summary: 取关（幂等）
      operationId: unfollowTarget
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string, description: 'EntityRef type:id' }
      responses:
        '200':
          description: 取关状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { following: { type: boolean } }
  /followers:
    get:
      tags: [social]
      summary: 关注我的人（不设互相关注统计）
      operationId: listFollowers
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 粉丝列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/FollowItem' }
  /favorites:
    post:
      tags: [social]
      summary: 收藏（幂等；kind 由目标类型推导）
      operationId: favoriteTarget
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TargetRefInput' }
      responses:
        '200':
          description: 收藏状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { favorited: { type: boolean } }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [social]
      summary: 我的收藏（六类分 Tab）
      operationId: listFavorites
      security: [{ bearerAuth: [] }]
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [person, company, project, product, meeting, event] }
      responses:
        '200':
          description: 收藏列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/FavoriteItem' }
  /favorites/{ref}:
    delete:
      tags: [social]
      summary: 取消收藏
      operationId: unfavoriteTarget
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 收藏状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { favorited: { type: boolean } }
  /follow-unread:
    get:
      tags: [social]
      summary: 关注动态未读数
      operationId: getFollowUnread
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 未读数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties: { unread: { type: integer } }
  /orders:
    post:
      tags: [trade]
      summary: 创建订单（金额由业务模块计算并给快照；强制 Idempotency-Key）
      operationId: createOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderInput' }
      responses:
        '200':
          description: 订单（重复幂等键返回首单）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /orders/{id}:
    get:
      tags: [trade]
      summary: 查询订单（仅本人）
      operationId: getOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/pay:
    post:
      tags: [trade]
      summary: 发起支付（返回预支付参数；一单可多笔）
      operationId: payOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 预支付参数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PayParams' }
        '409': { $ref: '#/components/responses/Conflict' }
  /pay/notify:
    post:
      tags: [trade]
      summary: 微信支付回调（验签 + 幂等；重复/乱序安全）
      operationId: payNotify
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: 处理结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order_id: { type: string }
                          already_paid: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
  /search:
    get:
      tags: [discovery]
      summary: 六类内容检索（关键词与标签独立可用；PG 实现经 Search 端口抽象）
      operationId: search
      parameters:
        - name: q
          in: query
          schema: { type: string, description: 名称关键词 }
        - name: type
          in: query
          schema: { type: string, enum: [user, org, content.project, content.product, content.meeting, content.event] }
        - name: region
          in: query
          schema: { type: string }
        - name: industry
          in: query
          schema: { type: string, description: '行业 code，逗号分隔' }
        - name: need
          in: query
          schema: { type: string, description: '合作需求 code，逗号分隔' }
        - name: offer
          in: query
          schema: { type: string, description: '合作供给 code，逗号分隔' }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 搜索结果（分类返回；空则前端显示「没有找到相关内容」）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/DiscoveryCard' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /feed:
    get:
      tags: [bff]
      summary: 首屏单次聚合（卡片流 + 画像进度 + 未读数；读预计算候选，首屏 ≤3 秒）
      operationId: feed
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, description: 换一批偏移 }
      responses:
        '200':
          description: 聚合结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FeedData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /feed/refresh:
    post:
      tags: [bff]
      summary: 换一批（同一聚合，客户端传 offset 下翻）
      operationId: feedRefresh
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: 聚合结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FeedData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /aggregate/detail:
    get:
      tags: [bff]
      summary: 详情页聚合（名片+Badges+会员等级+关注状态；内容类含归属人名片）；游客可看（登录态可选）
      operationId: aggregateDetail
      security: []
      parameters:
        - name: ref
          in: query
          required: true
          schema: { type: string, description: 'EntityRef，如 user:123 / content.project:456' }
      responses:
        '200':
          description: 聚合详情（游客访问时 following=false、member 省略）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DetailData' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /aggregate/contact:
    get:
      tags: [bff]
      summary: 揭示联系方式（手机号，会员权益；非会员 120007）
      operationId: aggregateContact
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ref
          in: query
          required: true
          schema: { type: string, description: 'EntityRef，仅 user:<id> / org:<id>' }
      responses:
        '200':
          description: 联系方式
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ref: { type: string }
                          phone: { type: string, description: '未配置时为空串' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /matches:
    get:
      tags: [discovery]
      summary: 我的匹配（与 /feed 同源）
      operationId: listMatches
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 匹配卡片
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/DiscoveryCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /matches/{ref}/explain:
    get:
      tags: [discovery]
      summary: 匹配解释（规则模板生成，不依赖 LLM）
      operationId: explainMatch
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string, description: 'EntityRef，如 user:123' }
      responses:
        '200':
          description: 解释
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ref: { type: string }
                          score: { type: number }
                          reason:
                            type: array
                            items: { $ref: '#/components/schemas/MatchReason' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sessions:
    post:
      tags: [msg]
      summary: 发起单聊（幂等；同一对用户唯一会话；发起=会员权益）
      operationId: ensureSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_ref]
              properties: { target_ref: { type: string, description: 'user:<id>' } }
      responses:
        '200':
          description: 会话（含是否新建）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          created: { type: boolean }
                          session: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [msg]
      summary: 我的会话列表（含未读数）
      operationId: listSessions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sessions/{id}/messages:
    post:
      tags: [msg]
      summary: 发送消息（成员校验）
      operationId: sendMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                msg_type: { type: integer, default: 1, description: '1文本/2图片' }
                content: { type: string }
      responses:
        '200':
          description: 消息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [msg]
      summary: 增量拉取消息（cursor=已拉取最大 seq）
      operationId: syncMessages
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: integer, description: 已拉取最大 seq（默认 0） }
        - name: limit
          in: query
          schema: { type: integer, default: 20, description: '上限 50' }
      responses:
        '200':
          description: 增量消息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Message' }
                          next_cursor: { type: integer }
                          has_more: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sessions/{id}/read:
    post:
      tags: [msg]
      summary: 提交已读游标（幂等；清零该会话未读）
      operationId: markSessionRead
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { read_seq: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/OkEmpty' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /membership/quote:
    get:
      tags: [membership]
