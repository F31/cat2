        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{id}/members:
    get:
      tags: [circle]
      summary: 成员列表
      operationId: listCircleMembers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 成员 ID 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: object, properties: { items: { type: array, items: { type: string } } } }
  /circles/{id}/dissolve:
    post:
      tags: [circle]
      summary: 圈主解散（永久删除，通知全员）
      operationId: dissolveCircle
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { type: object, properties: { dissolved: { type: boolean } } } } } ] } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{id}/convert:
    post:
      tags: [circle]
      summary: 已结束转常设（圈主）
      operationId: convertCircle
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { type: object, properties: { converted: { type: boolean } } } } } ] } } } }
  /circles/{id}/demands:
    get:
      tags: [circle]
      summary: 圈内需求列表（生效在前；联系方式会员可见）
      operationId: listCircleDemands
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          description: 需求列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/CircleDemand' } }
    post:
      tags: [circle]
      summary: 发布需求（每人每日跨圈合计 3 条；VIP 可选全平台）
      operationId: publishCircleDemand
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CircleDemandInput' }
      responses:
        '200':
          description: 需求
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/CircleDemand' } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /circles/demands/{did}/renew:
    post:
      tags: [circle]
      summary: 需求到期续期 30 天（作者）
      operationId: renewCircleDemand
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: did, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { type: object, properties: { renewed: { type: boolean } } } } } ] } } } }
  /circles/{id}/feeds:
    post:
      tags: [circle]
      summary: 圈内动态/公告（公告仅圈主、每圈每日 ≤3 条不占个人额度）
      operationId: publishCircleFeed
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                image_file_ids: { type: array, items: { type: string } }
                is_announcement: { type: boolean }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { type: object, properties: { id: { type: string } } } } } ] } } } }
  /notices:
    get:
      tags: [notice]
      summary: 站内信列表（unread=1 仅未读）
      operationId: listNotices
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ['1'] } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          description: 站内信与未读数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/Notice' } }
                          unread: { type: integer }
  /notices/{id}/read:
    post:
      tags: [notice]
      summary: 标记站内信已读
      operationId: readNotice
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { type: object, properties: { read: { type: boolean } } } } } ] } } } }
  /notice-preferences:
    get:
      tags: [notice]
      summary: 通知偏好列表（资金与审核类不可关闭）
      operationId: listNoticePreferences
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 偏好列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/NoticePreference' } }
    put:
      tags: [notice]
      summary: 设置通知偏好
      operationId: setNoticePreference
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_code, enabled]
              properties: { template_code: { type: string }, enabled: { type: boolean } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { type: object, properties: { saved: { type: boolean } } } } } ] } } } }
  /subscribe-quota/apply:
    post:
      tags: [notice]
      summary: 申请订阅消息授权额度（上下文动作处调用）
      operationId: applySubscribeQuota
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_code]
              properties: { template_code: { type: string }, n: { type: integer } }
      responses:
        '200': { description: 结果, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { type: object, properties: { applied: { type: boolean } } } } } ] } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access Token（RS256 JWT，仅含 sub/sid/authz_ver，2h 有效）
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, description: 写操作幂等键；重复提交返回首次结果 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, description: 上一页 next_cursor；缺省为首页 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
  schemas:
    Cube:
      type: object
      required: [id, name, leader_id, plan_level, status, member_count]
      properties:
        id: { type: string }
        name: { type: string }
        leader_id: { type: string }
        honey_id: { type: string }
        plan_level: { type: integer, description: '1 基础 / 2 进阶 / 3 高阶' }
        plan_expire_at: { type: string, format: date-time, nullable: true }
        status: { type: integer, description: '0 正常 / 1 封禁 / 2 已解散' }
        member_count: { type: integer }
        region_code: { type: string }
    CubeDetail:
      allOf:
        - $ref: '#/components/schemas/Cube'
        - type: object
          properties:
            org_id: { type: string }
            industry_codes: { type: array, items: { type: string } }
            chain_stage: { type: string }
            direction: { type: string }
            resources: { type: string }
            strength: { type: string }
            cooperation: { type: string }
            my_role: { type: integer, description: '0 非成员 / 1 猫王 / 2 猫蜜 / 3 成员 / 4 共建成员' }
    CubeMember:
      type: object
      required: [user_id, role, status]
      properties:
        user_id: { type: string }
        role: { type: integer }
        status: { type: integer }
        joined_at: { type: string, format: date-time }
    InviteTicket:
      type: object
      required: [code, expire_at, need_confirm]
      properties:
        code: { type: string }
        expire_at: { type: string, format: date-time }
        need_confirm: { type: boolean }
    CubeCreateInput:
      type: object
      required: [name, honey_user_id]
      properties:
        name: { type: string, description: '≤64字' }
        org_id: { type: string, description: 可关联一个组织（保持独立实体） }
        region_code: { type: string }
        industry_codes: { type: array, items: { type: string } }
        chain_stage: { type: string }
        direction: { type: string }
        resources: { type: string, description: 有啥 }
        strength: { type: string, description: 优势 }
        cooperation: { type: string, description: 合作 }
        honey_user_id: { type: string, description: 必配猫蜜（不可为自己） }
    CubeProject:
      type: object
      required: [id, cube_id, type, name, leader_id, status]
      properties:
        id: { type: string }
        cube_id: { type: string }
        type: { type: integer, description: '1 研究 / 2 承接' }
        content_project_id: { type: string, description: 引用平台项目（可空） }
        name: { type: string }
        related_ref: { type: string }
        related_customer: { type: string }
        leader_id: { type: string }
        participants: { type: array, items: { type: string } }
        progress: { type: integer }
        todo_count: { type: integer }
        status: { type: integer, description: '0 进行中 / 1 已关闭' }
        source_ref: { type: string }
        created_at: { type: string, format: date-time }
    CubeProjectInput:
      type: object
      required: [name]
      properties:
        type: { type: integer, description: '1 研究 / 2 承接' }
        name: { type: string }
        related_ref: { type: string }
        related_customer: { type: string }
        participants: { type: array, items: { type: string } }
        content_project_id: { type: string }
        source_ref: { type: string }
    CubeResearch:
      type: object
      required: [id, project_id, content, operator_id]
      properties:
        id: { type: string }
        project_id: { type: string }
        content: { type: string }
        decision: { type: string }
        operator_id: { type: string }
        created_at: { type: string, format: date-time }
    CubeTask:
      type: object
      required: [id, cube_id, title, assignee_id, status]
      properties:
        id: { type: string }
        cube_id: { type: string }
        project_id: { type: string, nullable: true, description: 空=内部工作安排 }
        title: { type: string }
        assignee_id: { type: string }
        progress: { type: integer }
        confirm_user_id: { type: string }
        due_at: { type: string, format: date-time, nullable: true }
        status: { type: integer, description: '0 待办 / 1 进行中 / 2 待确认 / 3 已完成' }
        reject_reason: { type: string }
        reopened_count: { type: integer }
        created_at: { type: string, format: date-time }
    CubeTaskInput:
      type: object
      required: [title, assignee_id]
      properties:
        project_id: { type: string }
        title: { type: string }
        assignee_id: { type: string }
        confirm_user_id: { type: string, description: 缺省猫王+猫蜜确认 }
        due_at: { type: string, format: date-time }
    CubeReport:
      type: object
      required: [id, cube_id, reporter_id, customer_name, status]
      properties:
        id: { type: string }
        cube_id: { type: string }
        project_id: { type: string, nullable: true }
        reporter_id: { type: string }
        customer_name: { type: string }
        customer_type: { type: string }
        region_code: { type: string }
        related_item_ref: { type: string }
        amount_wan: { type: integer }
        note: { type: string }
        status: { type: integer, description: '0 待确认 / 1 已确认 / 2 已驳回' }
        reject_reason: { type: string }
        confirmed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CubeReportInput:
      type: object
      required: [customer_name]
      properties:
        project_id: { type: string }
        customer_name: { type: string }
        contact_phone: { type: string, description: 联系人手机号（加密存储） }
        customer_type: { type: string }
        region_code: { type: string }
        related_item_ref: { type: string }
        amount_wan: { type: integer }
        note: { type: string, description: ≤200字 }
    Notice:
      type: object
      required: [id, template_code, title, content, channel, is_read]
      properties:
        id: { type: string }
        template_code: { type: string }
        title: { type: string }
        content: { type: string }
        ref: { type: string }
        channel: { type: string, enum: [inapp, subscribe, sms] }
        is_read: { type: boolean }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    NoticePreference:
      type: object
      required: [template_code, enabled, closeable]
      properties:
        template_code: { type: string }
        enabled: { type: boolean }
        closeable: { type: boolean }
    Circle:
      type: object
      required: [id, name, type, status, owner_user_id, member_count]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: integer, description: '1 常设 / 2 临时' }
        status: { type: integer, description: '0 进行中 / 1 已结束 / 2 已解散' }
        owner_user_id: { type: string }
        member_count: { type: integer }
        end_at: { type: string, format: date-time, nullable: true }
    CircleDetail:
      allOf:
        - $ref: '#/components/schemas/Circle'
        - type: object
          properties:
            intro: { type: string }
            cover_file_id: { type: string }
            region_code: { type: string }
            industry_codes: { type: array, items: { type: string } }
            my_role: { type: integer, description: '0 非成员 / 1 圈主 / 2 成员' }
            joined: { type: boolean }
            recommendable: { type: boolean, description: 新圈 7 天内不进推荐流 }
    CircleCreateInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        intro: { type: string }
        cover_file_id: { type: string }
        region_code: { type: string }
        industry_codes: { type: array, items: { type: string } }
        type: { type: integer, description: '1 常设 / 2 临时' }
        duration_days: { type: integer, enum: [7, 30, 90, 180] }
        org_id: { type: string }
    CircleDemand:
      type: object
      required: [id, circle_id, author_id, title, content, status]
      properties:
        id: { type: string }
        circle_id: { type: string }
        author_id: { type: string }
        title: { type: string, description: ≤30字 }
        content: { type: string, description: ≤500字 }
        demand_type: { type: string }
        region_code: { type: string }
        industry_codes: { type: array, items: { type: string } }
        expire_at: { type: string, format: date-time }
        scope: { type: integer, description: '1 仅本圈 / 2 全平台（VIP）' }
        status: { type: integer, description: '0 有效 / 1 已过期 / 2 已删除' }
        contact_phone: { type: string, description: 会员可见 }
        created_at: { type: string, format: date-time }
    CircleDemandInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string }
        content: { type: string }
        demand_type: { type: string }
        region_code: { type: string }
        industry_codes: { type: array, items: { type: string } }
        days: { type: integer, description: 有效期天数（默认 30） }
        scope: { type: integer, description: '1 仅本圈 / 2 全平台（会员）' }
        contact_phone: { type: string }
    CubeLinkReq:
      type: object
      required: [id, cube_id, content_project_id, initiator_id, target_role, status]
      properties:
        id: { type: string }
        cube_id: { type: string }
        content_project_id: { type: string }
        initiator_id: { type: string }
        target_role: { type: integer, description: '1 项目方确认 / 2 猫蜜确认' }
        status: { type: integer, description: '0 待确认 / 1 已同意 / 2 已拒绝' }
        created_at: { type: string, format: date-time }
    CubePlan:
      type: object
      required: [level, name, cube_limit, member_limit, price_fen]
      properties:
        level: { type: integer }
        name: { type: string }
        cube_limit: { type: integer, description: 0=不限 }
        member_limit: { type: integer, description: 0=不限 }
        price_fen: { type: integer }
    CubeApportion:
      type: object
      required: [id, cube_id, per_fen, target_n, pledged_count, status]
      properties:
        id: { type: string }
        cube_id: { type: string }
        per_fen: { type: integer, description: 每人分摊额=档价÷N }
        target_n: { type: integer }
        pledged_count: { type: integer }
        deadline: { type: string, format: date-time }
        status: { type: integer, description: '0 进行中 / 1 已成团 / 2 未成团 / 3 已终结' }
    Envelope:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: integer, description: 0=成功；否则 MMNNNN 错误码 }
        message: { type: string }
        request_id: { type: string }
        data: { nullable: true }
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: integer }
        message: { type: string }
        request_id: { type: string }
    Tokens:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: access token 秒数 }
    LoginData:
      type: object
      required: [user_id, new, tokens]
      properties:
        user_id: { type: string, description: int64 字符串 }
        new: { type: boolean, description: 是否新注册 }
        tokens: { $ref: '#/components/schemas/Tokens' }
    UserBrief:
      type: object
      required: [id, nickname, status]
      properties:
        id: { type: string, description: int64 字符串 }
        nickname: { type: string }
        avatar_file_id: { type: string }
        status: { type: integer, description: 0正常/1限制/2封禁/3已注销 }
    Card:
      type: object
      required: [user_id, identity_type, name, profile_tier]
      properties:
        user_id: { type: string }
        subject_type_code: { type: string }
        identity_type: { type: integer, description: 1个人/2组织 }
        name: { type: string }
        avatar_file_id: { type: string }
        region_code: { type: string }
        industry_codes: { type: array, items: { type: string } }
        need_codes: { type: array, items: { type: string } }
        offer_codes: { type: array, items: { type: string } }
        advantage_field: { type: string }
        background: { type: string }
        target_customers: { type: string }
        target_channels: { type: string }
        core_strength: { type: string }
        intro: { type: string }
        profile_tier: { type: integer, description: 1第一层/2第二层完整/3含增值画像 }
        has_contact: { type: boolean, description: 是否已配置联系方式（明文永不下发） }
    CardUpdate:
      type: object
      required: [name]
      properties:
        subject_type_code: { type: string }
        name: { type: string, description: '姓名或组织名称（≤128）' }
        avatar_file_id: { type: string }
        region_code: { type: string }
        industry_codes: { type: array, items: { type: string } }
        need_codes: { type: array, items: { type: string } }
        offer_codes: { type: array, items: { type: string } }
        advantage_field: { type: string }
        background: { type: string }
        target_customers: { type: string }
        target_channels: { type: string }
        qualification_file_ids: { type: array, items: { type: string }, description: 组织资质证明图片（经 media 绑定） }
        core_strength: { type: string, description: '核心业务优势（≤2000）' }
        intro: { type: string, description: '简介（个人≤500 / 组织≤5000）' }
        contact_phone: { type: string, description: 联系方式（加密存储，会员可见） }
        visibility_settings:
          type: object
          additionalProperties: { type: boolean }
          description: 字段级对外展示开关（缺省可见）
    Cert:
      type: object
      required: [id, user_id, cert_type, status]
      properties:
        id: { type: string }
        user_id: { type: string }
        cert_type: { type: integer, description: '1实名/2个人/3个人企业身份/4企业/5机构' }
        target_org_id: { type: string }
        status: { type: integer, description: '0待审核/1已通过/2已驳回' }
        reject_reason: { type: string }
        submitted_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
    CertifyInput:
      type: object
      required: [cert_type, agreed]
      properties:
        cert_type: { type: integer }
        real_name: { type: string }
        id_card_no: { type: string }
        agreed: { type: boolean, description: 实名认证服务协议勾选 }
        target_org_id: { type: string }
        material_file_ids: { type: array, items: { type: string } }
        extra: { type: object, additionalProperties: { type: string } }
    Badge:
      type: object
      required: [code, label, level]
      properties:
        code: { type: string }
        label: { type: string }
        level: { type: integer }
    Completion:
      type: object
      required: [complete, missing, tier]
      properties:
        complete: { type: boolean }
        missing:
          type: array
          items: { type: string, enum: [region, industry, need, offer, intro] }
        tier: { type: integer }
    TargetRefInput:
      type: object
      required: [target_ref]
      properties:
        target_ref: { type: string, description: 'EntityRef type:id，如 user:123 / content.project:456' }
    Target:
      type: object
      required: [type, id]
      properties:
        type: { type: string }
        id: { type: string }
    FollowItem:
      type: object
      required: [follower_id, target]
      properties:
        follower_id: { type: string }
        target: { $ref: '#/components/schemas/Target' }
        title: { type: string }
        cover: { type: string }
        created_at: { type: string, format: date-time }
    FavoriteItem:
      type: object
      required: [id, target, kind]
      properties:
        id: { type: string }
        target: { $ref: '#/components/schemas/Target' }
        kind: { type: string, enum: [person, company, project, product, meeting, event] }
        title: { type: string }
        cover: { type: string }
        created_at: { type: string, format: date-time }
    ReportReason:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
    ReportInput:
      type: object
      required: [target_ref, reason_code]
      properties:
        target_ref: { type: string, description: 'EntityRef type:id，如 content.project:123' }
        reason_code: { type: string, enum: [spam, fraud, porn, abuse, infringe, other] }
        detail: { type: string, description: '≤500字' }
    Order:
      type: object
      required: [id, biz_type, buyer_id, amount_fen, status, pay_expire_at]
      properties:
        id: { type: string }
        biz_type: { type: string, description: member/cube_plan 等 }
        biz_ref: { type: string }
        buyer_id: { type: string }
        amount_fen: { type: integer, description: 金额（分） }
        price_snapshot: { type: object, additionalProperties: true }
        status: { type: integer, description: '0待支付/1已支付/2已关闭' }
        pay_expire_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
    CreateOrderInput:
      type: object
      required: [biz_type, amount_fen]
      properties:
        biz_type: { type: string }
        biz_ref: { type: string }
        amount_fen: { type: integer }
        price_snapshot: { type: object, additionalProperties: true, description: 单价/年限/系数等快照 }
        subject: { type: string }
        expire_minutes: { type: integer, description: 支付超时分钟（默认 30） }
    PayParams:
      type: object
      required: [order_id, out_trade_no, prepay_id, amount_fen]
      properties:
        order_id: { type: string }
        out_trade_no: { type: string }
        prepay_id: { type: string }
        amount_fen: { type: integer }
    TagSet:
      type: object
      properties:
        industry: { type: array, items: { type: string } }
        region: { type: string }
        nature: { type: array, items: { type: string } }
        need: { type: array, items: { type: string } }
        offer: { type: array, items: { type: string } }
        domain: { type: array, items: { type: string } }
    ContentItem:
      type: object
      required: [id, kind, title, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [project, product, meeting, event] }
        owner_ref:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
        title: { type: string }
        cover_file_id: { type: string }
        region_code: { type: string }
        tagset: { $ref: '#/components/schemas/TagSet' }
        status: { type: integer, description: '0审核中/1展示中/2已下架' }
        reject_reason: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        fields: { type: object, additionalProperties: true, description: 类型子表字段（非会员不含会员可见字段） }
        member_gate: { type: array, items: { type: string }, description: 因非会员被隐藏的字段 }
        unlock_reason: { type: string }
    ContentPublishInput:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, enum: [project, product, meeting, event] }
        title: { type: string, description: '≤50字' }
        cover_file_id: { type: string }
        region_code: { type: string }
        tagset: { $ref: '#/components/schemas/TagSet' }
        org_ref: { type: string }
        fields: { type: object, additionalProperties: true }
    DictItem:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        parent_code: { type: string, nullable: true }
        sort: { type: integer }
    MembershipQuote:
      type: object
      required: [level, years, unit_fen, original_fen, discount_rate, total_fen]
      properties:
        level: { type: integer, description: '1 VIP / 3 企业版（2 SVIP 预留不上架）' }
        years: { type: integer }
        unit_fen: { type: integer, description: 年费单价（分） }
        original_fen: { type: integer, description: 单价 × 年限 }
        discount_rate: { type: integer, description: '折扣系数万分比（10000=无折扣；3 年 9000 / 5 年 8000）' }
        total_fen: { type: integer, description: 折后价 }
    MembershipMember:
      type: object
      required: [user_id, level, status, expires_at]
      properties:
        user_id: { type: string }
        level: { type: integer }
        status: { type: integer, description: '1生效中/2已过期' }
        expires_at: { type: string, format: date-time }
    OpenMembershipInput:
      type: object
      required: [level]
      properties:
        level: { type: integer, enum: [1, 3] }
        years: { type: integer, description: '默认 1；3/5 年享折扣' }
    SubAccount:
      type: object
      required: [id, master_id, sub_user_id, status]
      properties:
        id: { type: string }
        master_id: { type: string }
        sub_user_id: { type: string }
        status: { type: integer, description: '1生效/2已移除' }
        invited_at: { type: string, format: date-time }
    SessionPeer:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
        title: { type: string }
        cover: { type: string }
    Session:
      type: object
      required: [id, kind, last_seq, unread]
      properties:
        id: { type: string }
        kind: { type: integer, description: '1单聊/2群聊' }
        peer: { $ref: '#/components/schemas/SessionPeer' }
        last_seq: { type: integer }
        unread: { type: integer }
        last_message_at: { type: string, format: date-time, nullable: true }
    Message:
      type: object
      required: [id, session_id, seq, sender_id, msg_type, content]
      properties:
        id: { type: string }
        session_id: { type: string }
        seq: { type: integer }
        sender_id: { type: string }
        msg_type: { type: integer, description: '1文本/2图片' }
        content: { type: string }
        created_at: { type: string, format: date-time }
    MatchReason:
      type: object
      required: [dimension, text]
      properties:
        dimension: { type: string }
        text: { type: string }
    DiscoveryCard:
      type: object
      required: [ref, type, title]
      properties:
        ref: { type: string, description: 'EntityRef type:id' }
        type: { type: string, description: 'user/org/content.project/...' }
        title: { type: string }
        cover: { type: string }
        region: { type: string }
        score: { type: number, description: 匹配分 0~100 }
        member_level: { type: integer }
        verified: { type: boolean }
        reason:
          type: array
          items: { $ref: '#/components/schemas/MatchReason' }
    UnreadData:
      type: object
      required: [follow, msg, total]
      properties:
        follow: { type: integer, description: 关注未读 }
        msg: { type: integer, description: 消息未读 }
        total: { type: integer }
    FeedData:
      type: object
      required: [items, profile_progress, unread]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DiscoveryCard' }
        profile_progress: { $ref: '#/components/schemas/Completion' }
        unread: { $ref: '#/components/schemas/UnreadData' }
    DetailData:
      type: object
      required: [ref, type, following]
      properties:
        ref: { type: string }
        type: { type: string }
        card: { $ref: '#/components/schemas/Card' }
        content: { $ref: '#/components/schemas/ContentItem' }
        owner: { $ref: '#/components/schemas/Card' }
        badges:
          type: array
          items: { $ref: '#/components/schemas/Badge' }
        member: { $ref: '#/components/schemas/MembershipMember' }
        following: { type: boolean }
  responses:
    OkEmpty:
      description: 成功（无业务数据）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未认证或令牌失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 无权限或权限门未满足（如发布需实名）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 状态冲突（如已完成实名）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 限流或登录尝试过于频繁
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UpstreamError:
      description: 上游（微信等）调用失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
