# IP/HTTP 初始部署（无域名/证书）：应用层登录页 + 令牌鉴权；仅健康检查公开。
# 域名与证书就绪后替换为 catcube.conf（TLS）。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/catcube-admin;
    index index.html;
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /healthz { proxy_pass http://127.0.0.1:8080; access_log off; }
    location = /readyz  { proxy_pass http://127.0.0.1:8080; access_log off; }
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    # 后台接口：应用层口令登录 + X-Admin-Token；小程序接口由微信登录保护
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/mp/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
