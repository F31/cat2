# IP/HTTP 初始部署（无域名/证书）：Nginx Basic Auth 保护后台与 API，仅健康检查公开。
# 域名与证书就绪后替换为 catcube.conf（TLS）。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/catcube-admin;
    index index.html;
    client_max_body_size 20m;

    auth_basic "catcube";
    auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /healthz { auth_basic off; proxy_pass http://127.0.0.1:8080; access_log off; }
    location = /readyz  { auth_basic off; proxy_pass http://127.0.0.1:8080; access_log off; }
    location = /metrics {
        auth_basic off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
