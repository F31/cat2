version: "3.9"

# S0 一体形态：app（全角色全模块）+ PostgreSQL，PITR 备份依赖云侧/外部挂载
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: catcube
      POSTGRES_PASSWORD: catcube
      POSTGRES_DB: catcube
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catcube"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    command: ["serve"]
    environment:
      CATCUBE_DATABASE_URL: postgres://catcube:catcube@db:5432/catcube?sslmode=disable
      CATCUBE_HTTP_ADDR: ":8080"
      CATCUBE_ROLES: api,worker,scheduler,admin
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
